<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FilmX Studios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><path fill=%22%23e63946%22 d=%22M0 4v8h16V4H0zm1 1h2v1.5H1V5zm2 3H1v1.5h2V8zm-2 3v-1.5h2V11H1zm3-6h8v6H4V5zm11 0h-2v1.5h2V5zm-2 3h2v1.5h-2V8zm2 3h-2v-1.5h2V11zM5 6v4h6V6H5zm1 1h4v2H6V7z%22/></svg>"
        type="image/svg+xml">
</head>

<body class="dark-mode">

    <div class="auth-wrapper" style="background-image: url('assets/images/camera.png');">
        <div class="auth-card animate-up">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none h3 fw-bold mb-4" style="color: var(--tertiary);">
                    <i class="bi bi-camera-reels me-2 border-0"></i>Film<span style="color: var(--secondary);">X</span>
                </a>
                <h4 class="mt-4 fw-bold text-white">Welcome Back</h4>
                <p class="text-muted" style="color: #a8b2d1 !important;">Sign in to continue to your account</p>
            </div>

            <form class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label" style="color: #a8b2d1;">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label mb-0" style="color: #a8b2d1;">Password</label>
                        <a href="#" class="small text-decoration-none" style="color: var(--secondary);">Forgot
                            Password?</a>
                    </div>
                    <input type="password" class="form-control mt-2" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-main w-100 py-3 mb-4">Log In</button>
            </form>

            <div class="text-center mb-4">
                <span class="text-muted" style="color: #a8b2d1 !important;">Or sign in with</span>
            </div>

            <div class="d-flex justify-content-center gap-3 mb-4">
                <a href="#"
                    class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center border-secondary"
                    style="width: 45px; height: 45px;">
                    <i class="bi bi-google"></i>
                </a>
                <a href="#"
                    class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center border-secondary"
                    style="width: 45px; height: 45px;">
                    <i class="bi bi-facebook"></i>
                </a>
                <a href="#"
                    class="btn btn-outline-light rounded-circle p-2 d-flex align-items-center justify-content-center border-secondary"
                    style="width: 45px; height: 45px;">
                    <i class="bi bi-apple"></i>
                </a>
            </div>

            <div class="text-center mt-4">
                <p class="mb-0" style="color: #a8b2d1;">Don't have an account? <a href="signup.html"
                        class="text-decoration-none fw-bold" style="color: var(--secondary);">Sign up</a></p>
                <div class="mt-4">
                    <a href="index.html" class="text-decoration-none" style="color: #a8b2d1;"><i
                            class="bi bi-arrow-left"></i> Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
